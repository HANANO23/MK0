<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>경영학 CBT 모의고사 (랜덤 셔플 & 암기 해설 강화판)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f2f4f7;
      color: #1f2937;
      padding: 12px;
      line-height: 1.5;
    }

    .cbt-container {
      max-width: 1050px;
      margin: 0 auto;
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .main-content {
      flex: 1;
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      width: 100%;
    }

    .sidebar {
      width: 280px;
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 12px;
    }

    .sidebar-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .omr-list {
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding-right: 4px;
      flex: 1;
    }

    .omr-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      font-size: 13px;
      cursor: pointer;
      background-color: #f9fafb;
      transition: all 0.15s ease;
    }

    .omr-item.active {
      border-color: #2563eb;
      font-weight: bold;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }

    .status-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .status-unanswered {
      background-color: #e5e7eb;
      color: #6b7280;
    }

    .status-correct {
      background-color: #d1fae5;
      color: #047857;
    }

    .status-wrong {
      background-color: #fee2e2;
      color: #b91c1c;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 2px solid #e5e7eb;
      margin-bottom: 16px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      background-color: #eff6ff;
      color: #2563eb;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .btn-shuffle {
      background-color: #4f46e5;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-shuffle:hover {
      background-color: #4338ca;
    }

    .progress-text {
      font-size: 14px;
      font-weight: 700;
      color: #4b5563;
    }

    .question-box {
      margin-bottom: 20px;
    }

    .question-title {
      font-size: 16px;
      font-weight: 700;
      color: #111827;
      white-space: pre-line;
      word-break: keep-all;
      line-height: 1.6;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .option-btn {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 12px 14px;
      font-size: 14px;
      text-align: left;
      background-color: #f9fafb;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
      min-height: 48px;
    }

    .option-btn:hover {
      border-color: #9ca3af;
      background-color: #f3f4f6;
    }

    .option-btn.correct {
      border-color: #059669 !important;
      background-color: #ecfdf5 !important;
      color: #047857 !important;
      font-weight: 700;
    }

    .option-btn.wrong {
      border-color: #dc2626 !important;
      background-color: #fef2f2 !important;
      color: #b91c1c !important;
    }

    .explanation-box {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-left: 5px solid #10b981;
      padding: 16px;
      border-radius: 10px;
      font-size: 13.5px;
      color: #1e293b;
      white-space: pre-line;
      margin-bottom: 20px;
      display: none;
      word-break: keep-all;
      line-height: 1.65;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px 0;
      font-size: 15px;
      font-weight: 600;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      text-align: center;
      min-height: 48px;
    }

    .btn-prev {
      background-color: #e5e7eb;
      color: #374151;
    }

    .btn-next {
      background-color: #2563eb;
      color: #ffffff;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    @media (max-width: 768px) {
      .cbt-container {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        max-height: 250px;
        position: static;
      }
      .omr-list {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>
<body>

  <div class="cbt-container">
    <div class="main-content">
      <div class="header">
        <div class="header-left">
          <span class="badge" id="categoryBadge">카테고리</span>
          <button class="btn-shuffle" onclick="resetAndShuffle()">🎲 문제 새로 섞기</button>
        </div>
        <span class="progress-text"><span id="currentIndex">1</span> / <span id="totalIndex">52</span></span>
      </div>

      <div class="question-box">
        <div class="question-title" id="questionTitle">문제를 불러오는 중입니다...</div>
      </div>

      <div class="options-list" id="optionsList"></div>

      <div class="explanation-box" id="explanationBox"></div>

      <div class="nav-buttons">
        <button class="btn btn-prev" id="prevBtn" onclick="prevQuestion()" disabled>이전</button>
        <button class="btn btn-next" id="nextBtn" onclick="nextQuestion()">다음</button>
      </div>
    </div>

    <div class="sidebar">
      <div class="sidebar-title">
        <span>답안 현황</span>
        <span style="font-size: 12px; color: #6b7280;" id="scoreSummary">맞힘: 0/52</span>
      </div>
      <div class="omr-list" id="omrList"></div>
      <button class="btn-shuffle" style="margin-top: 12px; width: 100%; padding: 10px;" onclick="resetAndShuffle()">🎲 문제 다시 섞기</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        id: 1,
        category: "경영 - 마케팅",
        question: "다음 중 기업이 고객, 정부, 시민단체 등 여러 집단과 언론 보도의 커뮤니케이션 활동으로 호의적인 관계를 유지하는 촉진 수단은?",
        options: ["PR (Public Relations)", "광고 (Advertising)", "인적 판매 (Personal Selling)", "판매 촉진 (Sales Promotion)", "다이렉트 마케팅 (Direct Marketing)"],
        answer: 1,
        explanation: "[정답] ① PR (Public Relations)\n\n💡 [핵심 요약]\nPR = 이해관계자들과의 호의적 관계 구축 (비대가성/높은 신뢰도)\n\n📌 [상세 해설]\n- PR은 기업이 고객, 정부, 언론, 시민단체 등 다양한 이해관계자와 지속적인 신뢰를 구축하기 위한 활동입니다.\n- 언론의 '퍼블리시티(기사화)'를 주로 이용하므로 직접 광고비를 지불하지 않아 소비자 신뢰도가 매우 높습니다.\n\n🔑 [암기 팁]\n• 광고: 돈 내고 사는 홍보 (대가성)\n• PR: 관계 구축 및 기사화 (비대가성)"
      },
      {
        id: 2,
        category: "경영 - 전략",
        question: "다음 중 BCG 매트릭스에서 시장성장률은 낮으나 상대적 시장점유율은 높아 지속적으로 이윤을 창출하는 사업 부문은?",
        options: ["개 (Dog)", "스타 (Star)", "캐시카우 (Cash Cow)", "야생고양이 (Wild Cat)", "물음표 (Question Mark)"],
        answer: 3,
        explanation: "[정답] ③ 캐시카우 (Cash Cow)\n\n💡 [핵심 요약]\n캐시카우 = 성장률 Low + 점유율 High (돈 버는 효자)\n\n📌 [상세 해설]\n- 캐시카우(Cash Cow)는 시장 성장 가능성은 낮지만, 점유율이 높아 안정적인 현금을 쏟아내는 사업 부문입니다.\n- 이곳에서 창출된 현금은 Star나 Question Mark 사업으로 재투자됩니다.\n\n🔑 [BCG 매트릭스 4분면 핵심 공식]\n• Star: 성장률 High + 점유율 High (유망주)\n• Cash Cow: 성장률 Low + 점유율 High (현금창출)\n• Question Mark: 성장률 High + 점유율 Low (기회/고민)\n• Dog: 성장률 Low + 점유율 Low (철수 고려)"
      },
      {
        id: 3,
        category: "경영 - 전략",
        question: "다음 중 기업이 고객에게 독특한 가치를 제공하여 높은 가격 프리미엄을 얻는 마이클 포터(Michael E. Porter)의 본원적 전략은?",
        options: ["모방 전략", "수확 전략", "유지 전략", "차별화 전략", "원가우위 전략"],
        answer: 4,
        explanation: "[정답] ④ 차별화 전략\n\n💡 [핵심 요약]\n차별화 전략 = 남다른 독특함 ➔ 가격 프리미엄(고가격)\n\n📌 [상세 해설]\n- 디자인, 브랜드, 품질, 서비스 등에서 경쟁사와 확연히 다른 독특한 가치를 제공하여 고객 충성도를 높이고, 비싼 가격을 부과하는 전략입니다.\n\n🔑 [마이클 포터 본원적 전략 3가지]\n1. 원가우위: 싸게 대량 생산 (예: 다이소)\n2. 차별화: 특별한 가치와 고가격 (예: 애플)\n3. 집중화: 특정 니치 시장 공략"
      },
      {
        id: 4,
        category: "경영 - 국제경영",
        question: "다음 중 자원 투입의 위험 정도가 가장 낮으며 통제의 필요성도 가장 낮은 해외시장 진출방법은?",
        options: ["간접 수출", "라이선싱", "합작 투자", "직접 투자", "프랜차이징"],
        answer: 1,
        explanation: "[정답] ① 간접 수출\n\n💡 [핵심 요약]\n간접 수출 = 위험 최저, 통제력 최저 (대행사 이용)\n\n📌 [상세 해설]\n- 국내 무역상사나 수출대행업체를 거쳐 해외에 파는 방식입니다.\n- 기업이 해외 현지를 직접 통제하진 못하지만, 투자 리스크와 자원 투입 부담이 가장 적습니다.\n\n🔑 [해외 진출 위험/통제 순서 (낮음 ➔ 높음)]\n간접수출 ➔ 직접수출 ➔ 라이선싱 ➔ 합작투자 ➔ 단독 직접투자(FDI)"
      },
      {
        id: 5,
        category: "경영 - 전략",
        question: "산업구조분석모형(5 Forces Model)으로 기업 환경을 분석할 때 공급자의 교섭력이 강한 상황과 가장 거리가 먼 것은?",
        options: ["공급자의 수가 적은 경우", "구매자의 전환비용이 낮은 경우", "공급자의 전방통합 능력이 높은 경우", "공급하는 제품의 차별화 정도가 높은 경우", "구매자가 공급자의 비용구조에 대한 정보가 적은 경우"],
        answer: 2,
        explanation: "[정답] ② 구매자의 전환비용이 낮은 경우\n\n💡 [핵심 요약]\n전환비용이 '낮으면' 다른 곳으로 쉽게 바꾸므로 구매자의 교섭력이 강해집니다!\n\n📌 [상세 해설]\n- 전환비용(Switching Cost): 거래처를 바꿀 때 드는 시간과 비용.\n- 전환비용이 낮으면 구매자가 맘대로 바꿀 수 있어 '구매자' 파워가 세지고 '공급자' 파워는 약해집니다.\n- 공급자의 교섭력이 강해지려면 전환비용이 '높아야' 합니다."
      },
      {
        id: 6,
        category: "경영 - 회계",
        question: "다음 중 아래 설명에 해당하는 재무제표는?\n\n'특정 시점의 기업의 자산과 부채, 자본을 나타낸다. 차변에 있는 자산 금액의 합계는 대변에 있는 부채와 자본 금액의 합계와 항상 일치한다.'",
        options: ["주석", "자본변동표", "현금흐름표", "재무상태표", "손익계산서"],
        answer: 4,
        explanation: "[정답] ④ 재무상태표\n\n💡 [핵심 요약]\n재무상태표 = 특정 시점의 자산/부채/자본 (정태적 보고서)\n\n📌 [상세 해설]\n- 특정 시점(예: 12월 31일 기준)의 재무 상태를 보여줍니다.\n- 대차평균의 원리: [자산(차변) = 부채 + 자본(대변)] 공식이 항상 성립합니다.\n\n🔑 [손익계산서 vs 재무상태표]\n• 재무상태표: 특정 '시점' (스냅샷)\n• 손익계산서: 일정 '기간' 동안의 성과 (동영상)"
      },
      {
        id: 7,
        category: "경영 - 조직행동",
        question: "브룸(Vroom)의 기대이론 중 '내가 높은 성과를 올리면 그에 상응하는 보상을 받을 것이다'라고 믿는 정도에 해당하는 개념은?",
        options: ["유의성 (Valence)", "타당성 (Validity)", "공정성 (Fairness)", "효과성 (Effectiveness)", "수단성 (Instrumentality)"],
        answer: 5,
        explanation: "[정답] ⑤ 수단성 (Instrumentality)\n\n💡 [핵심 요약]\n수단성 = [성과 ➔ 보상] 연결 고리에 대한 확신!\n\n📌 [상세 해설]\n브룸의 동기부여 3대 요소:\n1. 기대(Expectancy): 노력하면 성과를 낼까? (노력 ➔ 성과)\n2. 수단성(Instrumentality): 성과를 내면 보상을 줄까? (성과 ➔ 보상)\n3. 유의성(Valence): 그 보상이 나한테 가치가 있나? (보상의 가치)"
      },
      {
        id: 8,
        category: "경영 - 조직이론",
        question: "다음 중 유기적 조직에 비해 기계적 조직이 가진 특성으로 가장 거리가 먼 것은?",
        options: ["업무의 공식화", "다단계 보고체계", "수평적 소통체계", "높은 직무 전문화", "프로세스의 표준화"],
        answer: 3,
        explanation: "[정답] ③ 수평적 소통체계\n\n💡 [핵심 요약]\n기계적 조직 = 수직적/관료적 / 유기적 조직 = 수평적/유연함\n\n📌 [상세 해설]\n- 기계적 조직: 피라미드식 수직적 보고, 높은 분업화, 엄격한 규칙, 표준화.\n- 유기적 조직: 자율적, 팀 중심, 수평적 소통, 변화에 빠른 대응."
      },
      {
        id: 9,
        category: "경영 - 회계",
        question: "재무상태표는 자산, 부채, 자본으로 구성된다. 다음 중 재무상태표의 자산 계정에 해당하는 항목은?",
        options: ["선급금", "자본금", "매입채무", "미지급금", "이익잉여금"],
        answer: 1,
        explanation: "[정답] ① 선급금\n\n💡 [핵심 요약]\n선급금 = 먼저 준 돈 ➔ 나중에 상품/서비스를 받을 '권리'(자산)\n\n📌 [상세 해설]\n• 자산: 선급금 (먼저 지급한 계약금)\n• 부채: 매입채무, 미지급금 (주어야 할 돈)\n• 자본: 자본금, 이익잉여금"
      },
      {
        id: 10,

    let currentIndex = 0;
    const userAnswers = {};

    // 문제 배열을 랜덤으로 섞는 함수 (Fisher-Yates 알고리즘)
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    // 문제를 섞고 상태를 초기화하는 함수
    function resetAndShuffle() {
      if (Object.keys(userAnswers).length > 0) {
        if (!confirm("문제를 새로 섞으시겠습니까? 지금까지 풀었던 모든 답안 기록이 초기화됩니다.")) {
          return;
        }
      }
      shuffleArray(questions);
      for (let key in userAnswers) {
        delete userAnswers[key];
      }
      currentIndex = 0;
      renderQuestion();
    }

    function renderOmr() {
      const omrList = document.getElementById("omrList");
      omrList.innerHTML = "";

      let correctCount = 0;

      questions.forEach((q, idx) => {
        const item = document.createElement("div");
        item.className = `omr-item ${idx === currentIndex ? "active" : ""}`;
        
        const selected = userAnswers[idx];
        let statusText = "미기입";
        let statusClass = "status-unanswered";

        if (selected !== undefined) {
          if (selected === q.answer) {
            statusText = "정답";
            statusClass = "status-correct";
            correctCount++;
          } else {
            statusText = "오답";
            statusClass = "status-wrong";
          }
        }

        item.innerHTML = `
          <span>${idx + 1}번</span>
          <span class="status-tag ${statusClass}">${statusText}</span>
        `;

        item.onclick = () => {
          currentIndex = idx;
          renderQuestion();
        };

        omrList.appendChild(item);
      });

      document.getElementById("scoreSummary").innerText = `맞힘: ${correctCount}/${questions.length}`;
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      document.getElementById("categoryBadge").innerText = q.category;
      document.getElementById("currentIndex").innerText = currentIndex + 1;
      document.getElementById("totalIndex").innerText = questions.length;
      
      // 동적 문제 번호 부여
      document.getElementById("questionTitle").innerText = `${currentIndex + 1}번 문제\n${q.question}`;

      const optionsList = document.getElementById("optionsList");
      optionsList.innerHTML = "";

      const explanationBox = document.getElementById("explanationBox");
      explanationBox.style.display = "none";

      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = `${idx + 1}. ${opt}`;

        const selectedOption = userAnswers[currentIndex];
        if (selectedOption !== undefined) {
          if (idx + 1 === q.answer) {
            btn.classList.add("correct");
          } else if (idx + 1 === selectedOption) {
            btn.classList.add("wrong");
          }
          explanationBox.style.display = "block";
          explanationBox.innerText = q.explanation;
        }

        btn.onclick = () => selectOption(idx + 1);
        optionsList.appendChild(btn);
      });

      document.getElementById("prevBtn").disabled = currentIndex === 0;
      document.getElementById("nextBtn").innerText = currentIndex === questions.length - 1 ? "완료" : "다음";

      renderOmr();
    }

    function selectOption(optionIndex) {
      if (userAnswers[currentIndex] !== undefined) return;
      userAnswers[currentIndex] = optionIndex;
      renderQuestion();
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        alert("모든 문제를 확인했습니다!");
      }
    }

    // 최초 로드 시 자동 문제 섞기 후 첫 화면 렌더링
    shuffleArray(questions);
    renderQuestion();
  </script>
